name: Reffi
options:
  bundleIdPrefix: com.reffi
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PhosphorSwift:
    path: Vendor/PhosphorSwift
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  # Google Analytics(GA4) — FirebaseAnalyticsCore만 링크한다(광고 식별자 지원 제품 미포함 → ATT 불필요).
  # GoogleService-Info.plist는 저장소에 없고(.gitignore) 빌드 머신이 Reffi/ 에 둔다(docs/ANALYTICS.md).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.2

schemes:
  Reffi:
    build:
      targets:
        Reffi: all
        ReffiTests: [test]
        ReffiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ReffiTests, ReffiUITests]

targets:
  Reffi:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Reffi
        excludes:
          - "Info.plist"
          # Finder/Xcode 사본("PrivacyInfo 2.xcprivacy" 등). .gitignore로는 못 막는다 —
          # XcodeGen은 git 무시 목록을 보지 않고 파일시스템을 그대로 훑기 때문에, 추적되지 않는
          # 사본 한 장이 그대로 리소스로 번들된다(실측: pbxproj 참조 4건, 프라이버시 매니페스트 2장).
          - "**/* [0-9].*"
    dependencies:
      - package: PhosphorSwift
        product: PhosphorSwift
      - package: Supabase
        product: Supabase
      - package: Firebase
        product: FirebaseAnalyticsCore
    preBuildScripts:
      # GA 설정 파일은 저장소 밖(.gitignore)이라 빠뜨리기 쉽다 — 없으면 앱은 GA 없이 조용히 돌므로 빌드에서 알린다.
      - name: Check GoogleService-Info.plist
        script: |
          if [ ! -f "$SRCROOT/Reffi/GoogleService-Info.plist" ]; then
            echo "warning: Reffi/GoogleService-Info.plist not found; Google Analytics will stay off in this build (docs/ANALYTICS.md)"
          fi
        basedOnDependencyAnalysis: false
    info:
      path: Reffi/Info.plist
      properties:
        CFBundleDisplayName: Reffi
        CFBundleName: Reffi
        # 버전 정본은 아래 settings의 MARKETING_VERSION/CURRENT_PROJECT_VERSION —
        # 여기 명시하지 않으면 xcodegen generate가 기본값(1.0/1)으로 plist를 되돌린다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # 화면 이벤트는 파이프라인이 `screen_view`로 직접 보낸다(SwiftUI엔 자동 추적이 UIViewController 단위라 무의미).
        FirebaseAutomaticScreenReportingEnabled: false
        NSCameraUsageDescription: "Reffi uses the camera to find grocery items on receipts for you to review and add."
        NSMotionUsageDescription: "Reffi uses device motion to move the ingredients on screen as you tilt your phone."
        CFBundleURLTypes:
          - CFBundleURLName: com.reffi.app.auth
            CFBundleURLSchemes:
              - reffi
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
          - GoogleSansFlex-Regular.ttf
          - OkDanDan-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reffi.app
        # Sign in with Apple — 시뮬레이터(서명 없음)에선 무시되고, 실기기/배포 서명 시 임베드된다.
        CODE_SIGN_ENTITLEMENTS: Reffi/Reffi.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "30"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        # Firebase Analytics(SPM) 요구 사항 — Objective-C 카테고리 링크.
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]

  ReffiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources: [ReffiTests]
    dependencies:
      - target: Reffi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Reffi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)Reffi"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

  ReffiUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ReffiUITests
    dependencies:
      - target: Reffi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.reffi.app.uitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Reffi
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
